spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  rabbitmq:
    addresses: ${CLOUDAMQP_URL}
    ssl:
      enabled: true
    listener:
      simple:
        retry:
          enabled: true
          max-retries: 3
          initial-interval: 2000ms # Wait 2 seconds before retry 1
          multiplier: 2 #